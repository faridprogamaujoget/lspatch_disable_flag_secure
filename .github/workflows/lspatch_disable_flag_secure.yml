name: Rebuild APK with Disable FLAG_SECURE and Anti-Exit

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK download link (takes priority)"
        required: false
      app_id:
        description: "Android app package (e.g. com.gobimbel_online - only if not using link)"
        required: false
      download_source:
        description: "APK download source (apk-pure, f-droid, huawei-app-gallery)"
        default: "apk-pure"
        required: false
      signture_bypass:
        description: "Signature bypass level [default: 0]"
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
      injectdex:
        description: "Inject dex directly"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and Patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          APP_ID="${{ github.event.inputs.app_id }}"
          APK_URL="${{ github.event.inputs.apk_url }}"
          DOWNLOAD_SOURCE="${{ github.event.inputs.download_source }}"
          SIGNTURE_BYPASS="${{ github.event.inputs.signture_bypass }}"
          INJECTDEX="${{ github.event.inputs.injectdex }}"
          BASENAME="patched"

          # 1. Download LSPatch
          LSPATCH_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/JingMatrix/LSPatch/releases \
            | jq -r '.[0].assets[] | select(.name | test(".*\\.jar$")) | .browser_download_url' | head -n 1)
          wget -O lspatch.jar "$LSPATCH_URL"

          # 2. Download Disable FLAG_SECURE Module
          MODULE_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Xposed-Modules-Repo/com.varuns2002.disable_flag_secure/releases \
            | jq -r '.[0].assets[] | select(.name | test("^Xposed-Disable-FLAG_SECURE_.*\\.apk$")) | .browser_download_url' | head -n 1)
          wget -O Xposed-Disable-FLAG_SECURE.apk "$MODULE_URL"

          # 3. Build Anti-Exit Module
          echo "Setting up anti-exit build environment..."
          mkdir -p xposed_build/src/com/bypass/lifecycle
          mkdir -p xposed_build/assets
          mkdir -p xposed_build/bin
          mkdir -p xposed_build/stubs/de/robv/android/xposed/callbacks

          echo "com.bypass.lifecycle.HookInit" > xposed_build/assets/xposed_init

          cat << 'EOF' > xposed_build/stubs/de/robv/android/xposed/callbacks/XC_LoadPackage.java
          package de.robv.android.xposed.callbacks;
          public class XC_LoadPackage {
              public static class LoadPackageParam {
                  public String packageName;
                  public ClassLoader classLoader;
              }
          }
          EOF

          cat << 'EOF' > xposed_build/stubs/de/robv/android/xposed/IXposedHookLoadPackage.java
          package de.robv.android.xposed;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(LoadPackageParam lpparam) throws Throwable;
          }
          EOF

          cat << 'EOF' > xposed_build/stubs/de/robv/android/xposed/XC_MethodHook.java
          package de.robv.android.xposed;
          public abstract class XC_MethodHook {
              public static class MethodHookParam {
                  public Object[] args;
                  public Object thisObject;
                  public Object result;
                  public Throwable throwable;
                  public Object getResult() { return result; }
                  public void setResult(Object result) { this.result = result; }
              }
              public static class Unhook {}
              public XC_MethodHook() {}
              public XC_MethodHook(int priority) {}
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
          }
          EOF

          cat << 'EOF' > xposed_build/stubs/de/robv/android/xposed/XC_MethodReplacement.java
          package de.robv.android.xposed;
          public abstract class XC_MethodReplacement extends XC_MethodHook {
              public static final XC_MethodReplacement DO_NOTHING = new XC_MethodReplacement() {
                  @Override
                  protected Object replaceHookedMethod(MethodHookParam param) throws Throwable {
                      return null;
                  }
              };
              public XC_MethodReplacement() {}
              public XC_MethodReplacement(int priority) {}
              @Override
              protected final void beforeHookedMethod(MethodHookParam param) throws Throwable {
                  try {
                      param.setResult(replaceHookedMethod(param));
                  } catch (Throwable t) {
                      param.throwable = t;
                  }
              }
              protected abstract Object replaceHookedMethod(MethodHookParam param) throws Throwable;
          }
          EOF

          cat << 'EOF' > xposed_build/stubs/de/robv/android/xposed/XposedHelpers.java
          package de.robv.android.xposed;
          public class XposedHelpers {
              public static Class<?> findClassIfExists(String className, ClassLoader classLoader) { return null; }
              public static XC_MethodHook.Unhook findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
              public static XC_MethodHook.Unhook findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) { return null; }
              public static Object getObjectField(Object obj, String fieldName) { return null; }
          }
          EOF

          cat << 'EOF' > xposed_build/src/com/bypass/lifecycle/HookInit.java
          package com.bypass.lifecycle;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XC_MethodReplacement;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;

          public class HookInit implements IXposedHookLoadPackage {

              public static class ForceTrueHook extends XC_MethodHook {
                  @Override
                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                      if (param.args != null && param.args.length > 0 && param.args[0] instanceof Boolean) {
                          param.args[0] = true;
                      }
                  }
              }

              public static class ReturnTrueHook extends XC_MethodHook {
                  @Override
                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                      param.setResult(true);
                  }
              }

              public static class LifecycleMessageFilter extends XC_MethodHook {
                  @Override
                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                      try {
                          String channelName = (String) XposedHelpers.getObjectField(param.thisObject, "name");
                          if ("flutter/lifecycle".equals(channelName)) {
                              Object msg = param.args[0];
                              if (msg != null && !msg.toString().contains("resumed")) {
                                  // Drop all inactive, paused, hidden, detached messages to Dart
                                  param.setResult(null);
                              }
                          }
                      } catch (Throwable ignored) {}
                  }
              }

              private void safeHook(String className, ClassLoader cl, String method, Object... args) {
                  try {
                      Class<?> clazz = XposedHelpers.findClassIfExists(className, cl);
                      if (clazz != null) {
                          XposedHelpers.findAndHookMethod(clazz, method, args);
                      }
                  } catch (Throwable ignored) {}
              }

              @Override
              public void handleLoadPackage(final LoadPackageParam lpparam) throws Throwable {
                  if (!"com.gobimbel_online".equals(lpparam.packageName)) return;
                  final ClassLoader cl = lpparam.classLoader;

                  // 1. Hook Flutter's BasicMessageChannel on 'flutter/lifecycle'
                  safeHook("io.flutter.plugin.common.BasicMessageChannel", cl, "send", Object.class, new LifecycleMessageFilter());

                  Class<?> replyClass = XposedHelpers.findClassIfExists("io.flutter.plugin.common.BasicMessageChannel$Reply", cl);
                  if (replyClass != null) {
                      safeHook("io.flutter.plugin.common.BasicMessageChannel", cl, "send", Object.class, replyClass, new LifecycleMessageFilter());
                  }

                  // 2. Hook direct LifecycleChannel triggers
                  safeHook("io.flutter.embedding.engine.systemchannels.LifecycleChannel", cl, "appIsInactive", XC_MethodReplacement.DO_NOTHING);
                  safeHook("io.flutter.embedding.engine.systemchannels.LifecycleChannel", cl, "appIsPaused", XC_MethodReplacement.DO_NOTHING);
                  safeHook("io.flutter.embedding.engine.systemchannels.LifecycleChannel", cl, "appIsHidden", XC_MethodReplacement.DO_NOTHING);
                  safeHook("io.flutter.embedding.engine.systemchannels.LifecycleChannel", cl, "appIsDetached", XC_MethodReplacement.DO_NOTHING);

                  // 3. Prevent focus loss across Activity, FlutterActivity, and Flutter delegates
                  String[] activityTargets = new String[] {
                      "android.app.Activity",
                      "io.flutter.embedding.android.FlutterActivity",
                      "io.flutter.embedding.android.FlutterActivityAndFragmentDelegate",
                      "com.gobimbel_online.MainActivity"
                  };

                  for (String target : activityTargets) {
                      safeHook(target, cl, "onWindowFocusChanged", boolean.class, new ForceTrueHook());
                      safeHook(target, cl, "onTopResumedActivityChanged", boolean.class, new ForceTrueHook());
                      safeHook(target, cl, "hasWindowFocus", new ReturnTrueHook());
                      safeHook(target, cl, "onUserLeaveHint", XC_MethodReplacement.DO_NOTHING);
                  }
              }
          }
          EOF

          cat << 'EOF' > xposed_build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.bypass.lifecycle">
              <application android:label="Disable Lifecycle">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Prevents exit detection" />
                  <meta-data android:name="xposedminversion" android:value="54" />
              </application>
          </manifest>
          EOF

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p xposed_build/stub_bin
          javac -source 8 -target 8 -Xlint:-options -d xposed_build/stub_bin $(find xposed_build/stubs -name "*.java")
          jar cf xposed_build/stubs.jar -C xposed_build/stub_bin .

          javac -source 8 -target 8 -Xlint:-options -cp "$PLATFORM_JAR:xposed_build/stubs.jar" -d xposed_build/bin xposed_build/src/com/bypass/lifecycle/HookInit.java

          $BUILD_TOOLS/d8 \
            --lib "$PLATFORM_JAR" \
            --classpath xposed_build/stubs.jar \
            --min-api 26 \
            xposed_build/bin/com/bypass/lifecycle/*.class \
            --output xposed_build/bin/

          $BUILD_TOOLS/aapt package -F xposed_build/module_unaligned.apk -M xposed_build/AndroidManifest.xml -I "$PLATFORM_JAR" -f
          (cd xposed_build/bin && zip -u ../module_unaligned.apk classes.dex)
          (cd xposed_build && zip -u -r module_unaligned.apk assets/)

          rm -f debug.keystore
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias debug -dname "CN=Debug" -validity 10000 -keyalg RSA -keysize 2048
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out disable_lifecycle.apk xposed_build/module_unaligned.apk

          # 4. Download Target Package
          mkdir -p apk_download
          if [ -n "$APK_URL" ]; then
            echo "Direct APK link detected: $APK_URL"
            wget -O apk_download/input.apk "$APK_URL"
            BASENAME="app"
          elif [ -n "$APP_ID" ]; then
            echo "App package ID detected: $APP_ID"
            APKEEP_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/EFForg/apkeep/releases/latest \
              | jq -r '.assets[] | select(.name=="apkeep-x86_64-unknown-linux-gnu") | .browser_download_url' | head -n 1)
            wget -O apkeep "$APKEEP_URL"
            chmod +x apkeep

            if [ -n "$DOWNLOAD_SOURCE" ]; then
              ./apkeep -a "$APP_ID" -d "$DOWNLOAD_SOURCE" ./apk_download
            else
              ./apkeep -a "$APP_ID" ./apk_download
            fi
            FILE=$(ls apk_download | head -n 1)
            BASENAME="${FILE%.*}"
          else
            echo "Error: Neither apk_url nor app_id was provided."
            exit 1
          fi

          # 5. Extract XAPK/APKS and merge if needed
          mkdir -p work_apks raw_extracted
          for item in apk_download/*; do
            if [ -f "$item" ]; then
              if unzip -l "$item" 2>/dev/null | grep -q '\.apk$'; then
                unzip -qo "$item" -d raw_extracted/
                find raw_extracted/ -type f -name "*.apk" -exec mv {} work_apks/ \;
              elif [[ "$item" == *.apk ]] || unzip -l "$item" 2>/dev/null | grep -q "AndroidManifest.xml"; then
                cp "$item" work_apks/
              fi
            fi
          done

          APK_COUNT=$(ls work_apks/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 1 ]; then
            cp work_apks/*.apk main.apk
          else
            APKEDITOR_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/REAndroid/APKEditor/releases \
              | jq -r '.[0].assets[] | select(.name | test("^APKEditor-.*\\.jar$")) | .browser_download_url' | head -n 1)
            wget -O APKEditor.jar "$APKEDITOR_URL"
            java -jar APKEditor.jar m -i work_apks -o main.apk
          fi

          # 6. Apply LSPatch with both modules
          mkdir -p lspatch
          INJECT_FLAG=""
          if [ "$INJECTDEX" = "true" ]; then
            INJECT_FLAG="--injectdex"
          fi

          java -jar lspatch.jar \
            -l "$SIGNTURE_BYPASS" \
            -m Xposed-Disable-FLAG_SECURE.apk \
            -m disable_lifecycle.apk \
            $INJECT_FLAG \
            -o lspatch main.apk

          OUTPUT_FILE=$(ls lspatch/*.apk | head -n 1)
          mv "$OUTPUT_FILE" "lspatch/${BASENAME}_patched.apk"

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: "lspatch/*.apk"
