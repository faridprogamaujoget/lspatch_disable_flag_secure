name: Rebuild APK with Disable FLAG_SECURE

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Android app package (e.g. com.instagram.android or com.app@version)"
        required: false
      apk_url:
        description: "Direct APK download link (only if you don't use package name)"
        required: false
      download_source:
        description: "APK download source (apk-pure, f-droid, huawei-app-gallery)"
        required: false
      signture_bypass:
        description: "Signature bypass level (increase if apk has protection) [default: 0]"
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
      injectdex:
        description: "Inject dex directly (useful if apk is browser)"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          APP_ID="${{ github.event.inputs.app_id }}"
          APK_URL="${{ github.event.inputs.apk_url }}"
          DOWNLOAD_SOURCE="${{ github.event.inputs.download_source }}"
          SIGNTURE_BYPASS="${{ github.event.inputs.signture_bypass }}"
          INJECTDEX="${{ github.event.inputs.injectdex }}"
          BASENAME="patched"

          # 1. Fetch LSPatch
          LSPATCH_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/JingMatrix/LSPatch/releases \
            | jq -r '.[0].assets[] | select(.name | test(".*\\.jar$")) | .browser_download_url' | head -n 1)

          if [ -z "$LSPATCH_URL" ] \vert{}\vert{} [ "$LSPATCH_URL" = "null" ]; then
            echo "Failed to resolve LSPATCH_URL"
            exit 1
          fi
          wget -O lspatch.jar "$LSPATCH_URL"

          # 2. Fetch Xposed Disable FLAG_SECURE Module
          MODULE_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Xposed-Modules-Repo/com.varuns2002.disable_flag_secure/releases \
            | jq -r '.[0].assets[] | select(.name | test("^Xposed-Disable-FLAG_SECURE_.*\\.apk$")) | .browser_download_url' | head -n 1)

          if [ -z "$MODULE_URL" ] \vert{}\vert{} [ "$MODULE_URL" = "null" ]; then
            echo "Failed to resolve MODULE_URL"
            exit 1
          fi
          wget -O Xposed-Disable-FLAG_SECURE.apk "$MODULE_URL"

          # 3. Fetch apkeep
          APKEEP_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/EFForg/apkeep/releases/latest \
            | jq -r '.assets[] | select(.name=="apkeep-x86_64-unknown-linux-gnu") | .browser_download_url' | head -n 1)

          wget -O apkeep "$APKEEP_URL"
          chmod +x apkeep

          # 4. Download Target APK
          mkdir -p apk_download
          if [ -n "$APP_ID" ]; then
            SRC="${DOWNLOAD_SOURCE:-apk-pure}"
            echo "Fetching $APP_ID from source:$SRC"

            export APKEEP_APKPURE_DANGERS_ACKNOWLEDGED=true
            export APKPURE_DANGERS_ACKNOWLEDGED=true

            ./apkeep -a "$APP_ID" -d "$SRC" ./apk_download
            FILE=$(ls apk_download | head -n 1)
            BASENAME="${FILE%.*}"
          elif [ -n "$APK_URL" ]; then
            wget -O apk_download/input.apk "$APK_URL"
            BASENAME="app"
          else
            echo "No input provided"
            exit 1
          fi

          if [ ! "$(ls -A apk_download)" ]; then
            echo "apk_download directory is empty"
            exit 1
          fi

          # 5. Extract containers and merge if split APK
          mkdir -p work_apks raw_extracted
          for item in apk_download/*; do
            if [ -f "$item" ]; then
              if unzip -l "$item" 2>/dev/null | grep
